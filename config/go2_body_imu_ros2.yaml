/**:
  ros__parameters:
    max_iteration: 4
    point_filter_num: 1
    cube_side_length: 200.0
    map_file_path: ""
    frames:
      world: li_init_go2_world
      lidar_pose: li_init_go2_lidar_pose
    common:
      lid_topic: /li_init_go2/input/cloud
      imu_topic: /li_init_go2/input/imu
    preprocess:
      lidar_type: 2  # PointCloud2 fields x/y/z/intensity/ring/time
      scan_line: 32
      blind: 1.0
      feature_extract_en: false
    initialization:
      cut_frame: true
      cut_frame_num: 2
      orig_odom_freq: 15
      mean_acc_norm: 9.81  # verify from a stationary Go2 body IMU sample
      fix_time_lag: false  # LiDAR and LowState IMU use distinct clock mappings
      online_refine_time: 20.0
      data_accum_length: 600.0
      Rot_LI_cov: [0.00005, 0.00005, 0.00005]
      Trans_LI_cov: [0.0001, 0.0001, 0.0001]
    mapping:
      filter_size_surf: 0.15
      filter_size_map: 0.25
      gyr_cov: 0.1
      acc_cov: 0.1
      grav_cov: 0.001
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      det_range: 30.0
    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
    runtime_pos_log_enable: false
