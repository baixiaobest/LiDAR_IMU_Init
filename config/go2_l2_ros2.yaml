li_init:
  ros__parameters:
    max_iteration: 4
    point_filter_num: 1
    cube_side_length: 200.0
    map_file_path: ""
    common:
      lid_topic: /li_init/input/cloud
      imu_topic: /li_init/input/imu
    preprocess:
      lidar_type: 2  # PointCloud2 fields x/y/z/intensity/ring/time
      scan_line: 32
      blind: 1.0
      feature_extract_en: false
    initialization:
      cut_frame: true
      cut_frame_num: 2  # 15-Hz L2 clouds -> about 30 calibration updates/s
      orig_odom_freq: 15
      mean_acc_norm: 11.09  # live stationary L2 IMU norm, head tilted up (2026-10-15)
      fix_time_lag: true  # L2 cloud and internal IMU share sensor timestamps
      online_refine_time: 20.0
      data_accum_length: 600.0
      Rot_LI_cov: [0.00005, 0.00005, 0.00005]
      Trans_LI_cov: [0.0001, 0.0001, 0.0001]
    mapping:
      filter_size_surf: 0.15
      filter_size_map: 0.25
      gyr_cov: 0.1
      acc_cov: 0.1
      grav_cov: 0.001
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      det_range: 30.0
    publish:
      path_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
    runtime_pos_log_enable: false
